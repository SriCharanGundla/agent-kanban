services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_kanban}
      POSTGRES_USER: ${POSTGRES_USER:-agent_kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_kanban_local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_kanban} -d ${POSTGRES_DB:-agent_kanban}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent_kanban}:${POSTGRES_PASSWORD:-agent_kanban_local}@database:5432/${POSTGRES_DB:-agent_kanban}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-secret-change-before-deploying}
      CORS_ORIGINS: '["http://localhost:7654"]'
      FRONTEND_URL: http://localhost:7654
      ENVIRONMENT: development
    ports:
      - "7655:8000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:7655}
    ports:
      - "7654:80"
    depends_on:
      - backend

volumes:
  postgres-data:
